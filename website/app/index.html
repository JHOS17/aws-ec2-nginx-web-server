<!DOCTYPE html>
<html>
<head>
  <title>Academia DevOps</title>
  <style>
    body { background:#0f172a; color:#06b6d4; font-family:monospace;
           text-align:center; padding:60px; margin:0; min-height:100vh;
           display:flex; flex-direction:column;
           align-items:center; justify-content:center; }
    h1   { font-size:3rem; margin-bottom:0.5rem; }
    p    { font-size:1.1rem; color:#f8fafc; }
    .badge { background:#1e293b; border:1px solid #06b6d4;
             color:#06b6d4; padding:8px 24px; border-radius:20px;
             display:inline-block; font-family:monospace; margin-top:8px; }
    .tag { font-size:0.75rem; color:#94a3b8; margin-top:2rem; }
  </style>
</head>
<body>
  <h1>🚀 Hola, DevOps!</h1>
  <p>Servidor activo en:</p>
  <div class="badge" id="host"></div>
  <p class="tag">Academia DevOps & Cloud · Nginx + SSL</p>
  <script>
    document.getElementById('host').textContent
      = window.location.hostname;
  </script>
</body>
</html>
